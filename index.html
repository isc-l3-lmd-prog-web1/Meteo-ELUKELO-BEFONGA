<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherHub - Accueil</title>
<style>
  body{font-family: 'Segoe UI', sans-serif;margin:0;padding:0;background:#e0f7fa;color:#333;}
  header, footer{background:#00796b;color:white;padding:15px;text-align:center;}
  nav a{margin:0 10px;color:white;text-decoration:none;font-weight:bold;}
  .container{padding:20px;text-align:center;}
  input, button{padding:10px;margin:5px;font-size:16px;}
  #weatherResult{margin-top:20px;}
  @media(max-width:600px){input, button{width:90%;}}
</style>
</head>
<body>
<header>
  <h1>WeatherHub 🌤️</h1>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="local.html">Météo locale</a>
    <a href="forecast.html">Prévisions</a>
    <a href="map.html">Carte</a>
    <a href="about.html">À propos</a>
  </nav>
</header>

<div class="container">
  <h2>Rechercher la météo d'une ville</h2>
  <input type="text" id="cityInput" placeholder="Entrez une ville">
  <button onclick="getWeather()">Voir la météo</button>
  <div id="weatherResult"></div>
</div>

<footer>
  &copy; 2026 WeatherHub
</footer>

<script>
async function getWeather(){
  const city = document.getElementById('cityInput').value;
  if(!city){alert('Veuillez entrer une ville'); return;}
  const apiKey = 'YOUR_API_KEY'; // Remplacez par votre clé OpenWeatherMap
  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=fr&appid=${apiKey}`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('Ville non trouvée');
    const data = await res.json();
    document.getElementById('weatherResult').innerHTML = `
      <h3>${data.name} - ${data.weather[0].description}</h3>
      <p>🌡️ Température : ${data.main.temp} °C</p>
      <p>💧 Humidité : ${data.main.humidity}%</p>
      <p>🌬️ Vent : ${data.wind.speed} m/s</p>
    `;
  }catch(err){document.getElementById('weatherResult').innerHTML = `<p>${err.message}</p>`;}
}
</script>
</body>
</html>
