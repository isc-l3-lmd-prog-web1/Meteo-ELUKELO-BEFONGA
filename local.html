<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherHub - Météo Locale</title>
<style>
  body{font-family:'Segoe UI', sans-serif;margin:0;padding:0;background:#f1f8e9;color:#333;}
  header, footer{background:#33691e;color:white;padding:15px;text-align:center;}
  nav a{margin:0 10px;color:white;text-decoration:none;font-weight:bold;}
  .container{padding:20px;text-align:center;}
</style>
</head>
<body>
<header>
<h1>WeatherHub 🌍</h1>
<nav>
<a href="index.html">Accueil</a>
<a href="local.html">Météo locale</a>
<a href="forecast.html">Prévisions</a>
<a href="map.html">Carte</a>
<a href="about.html">À propos</a>
</nav>
</header>

<div class="container">
  <h2>Météo basée sur votre position</h2>
  <button onclick="getLocalWeather()">Obtenir ma météo</button>
  <div id="localWeather"></div>
</div>

<footer>
&copy; 2026 WeatherHub
</footer>

<script>
async function getLocalWeather(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const apiKey = 'YOUR_API_KEY';
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=fr&appid=${apiKey}`;
      const res = await fetch(url);
      const data = await res.json();
      document.getElementById('localWeather').innerHTML = `
        <h3>${data.name} - ${data.weather[0].description}</h3>
        <p>🌡️ Température : ${data.main.temp} °C</p>
        <p>💧 Humidité : ${data.main.humidity}%</p>
        <p>🌬️ Vent : ${data.wind.speed} m/s</p>
      `;
    }, ()=>{alert('Position non autorisée')});
  }else{alert('Géolocalisation non supportée');}
}
</script>
</body>
</html>
